name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate Google Apps Script syntax
        run: node --check < cloud-sync/Code.gs

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # This repository does not commit Gradle wrapper scripts/JAR.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Add Android SDK tools to PATH
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Using $SDKMANAGER"

      - name: Install Android SDK Platform 36.1
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      # The app's debug signing config uses a root-level debug.keystore.
      # Generate a CI-only key so no private signing key is committed to Git.
      - name: Generate CI debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=AyamKas Pro,C=ID" \
            -noprompt

      - name: Build and run unit tests
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AyamKasPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports if build fails
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: AyamKasPro-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
