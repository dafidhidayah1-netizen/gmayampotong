name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      # Gradle wrapper scripts/JAR are not committed in this repository.
      # Install the exact Gradle distribution declared by gradle-wrapper.properties.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Install Android SDK Platform 36.1
        run: |
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      # The app's debug signing config uses a root-level debug.keystore.
      # Generate a CI-only key so no private signing key is committed to Git.
      - name: Generate CI debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=AyamKas Pro,C=ID" \
            -noprompt

      - name: Build and run unit tests
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AyamKasPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports if build fails
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: AyamKasPro-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
